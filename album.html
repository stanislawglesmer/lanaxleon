  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia" hidden>
    <button class="lightbox__close" type="button" aria-label="Zamknij zdjęcie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19" /></svg></button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Poprzednie zdjęcie"><svg class="arrow-icon arrow-icon--left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" /></svg></button>
    <img class="lightbox__image" src="" alt="" />
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Następne zdjęcie"><svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" /></svg></button>
    <span class="lightbox__count"></span>
  </div>
  <script>
    const items = [...document.querySelectorAll('.gallery__item')];
    const lightbox = document.querySelector('.lightbox');
    const enlarged = lightbox.querySelector('.lightbox__image');
    const count = lightbox.querySelector('.lightbox__count');
    let current = 0;
    function show(index) {
      current = (index + items.length) % items.length;
      const image = items[current].querySelector('img');
      enlarged.src = image.src;
      enlarged.alt = image.alt;
      count.innerHTML = `${String(current + 1).padStart(2, '0')} <span>/</span> 18`;
      lightbox.setAttribute('aria-label', `Zdjęcie ${current + 1} z 18`);
    }
    function close() { lightbox.hidden = true; document.body.style.overflow = ''; }
    items.forEach((item, index) => item.addEventListener('click', () => { show(index); lightbox.hidden = false; document.body.style.overflow = 'hidden'; }));
    lightbox.querySelector('.lightbox__close').addEventListener('click', close);
    lightbox.querySelector('.lightbox__nav--prev').addEventListener('click', () => show(current - 1));
    lightbox.querySelector('.lightbox__nav--next').addEventListener('click', () => show(current + 1));
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) close(); });
    window.addEventListener('keydown', (event) => {
      if (lightbox.hidden) return;
      if (event.key === 'Escape') close();
      if (event.key === 'ArrowLeft') show(current - 1);
      if (event.key === 'ArrowRight') show(current + 1);
    });
    const observer = new IntersectionObserver((entries) => entries.forEach((entry) => {
      if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); }
    }), { rootMargin: '0px 0px -35px 0px', threshold: .08 });
    document.querySelectorAll('.reveal').forEach((element) => observer.observe(element));
  </script>
